<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Master Drop Shadow Filter -->
    <filter id="speed-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1736" flood-opacity="0.45" />
    </filter>

    <!-- Metallic Gold 3D Gradients -->
    <linearGradient id="sgold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="25%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="75%" stop-color="#aa820a" />
      <stop offset="100%" stop-color="#ffd966" />
    </linearGradient>

    <linearGradient id="sgold-specular" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#aa820a" />
      <stop offset="30%" stop-color="#ffd966" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffd966" />
      <stop offset="100%" stop-color="#8a6508" />
    </linearGradient>

    <linearGradient id="sgold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fae19c" />
      <stop offset="70%" stop-color="#c99718" />
      <stop offset="100%" stop-color="#8a6508" />
    </linearGradient>

    <!-- Sunburst Dial Radial Gradient -->
    <radialGradient id="sunburst-dial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="45%" stop-color="#1e3a8a" />
      <stop offset="75%" stop-color="#0f204b" />
      <stop offset="100%" stop-color="#070e22" />
    </radialGradient>

    <!-- Subdial Concentric Sunken Gradient -->
    <radialGradient id="subdial-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1738" />
      <stop offset="85%" stop-color="#081026" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>

    <!-- Sapphire Lens Curved Reflection -->
    <linearGradient id="ssapphire-reflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Electric Cyan Speed Hand Glow -->
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group with Master Shadow -->
  <g filter="url(#speed-shadow)">
    <!-- Medallion Outer Metallic Rim (Beveled) -->
    <circle cx="200" cy="200" r="185" fill="url(#sgold-bevel)" stroke="#8a6508" stroke-width="2" />
    <circle cx="200" cy="200" r="180" fill="#0f172a" />
    <circle cx="200" cy="200" r="176" fill="url(#sgold-specular)" />

    <!-- External Pushers & Watch Crown (Chronograph Hardware) -->
    <!-- Crown at 3 o'clock -->
    <rect x="375" y="188" width="16" height="24" rx="3" fill="url(#sgold-specular)" stroke="#8a6508" stroke-width="1" />
    <line x1="380" y1="188" x2="380" y2="212" stroke="#aa820a" stroke-width="1" />
    <line x1="385" y1="188" x2="385" y2="212" stroke="#aa820a" stroke-width="1" />
    <!-- Start/Stop Pusher at 2 o'clock -->
    <polygon points="360,118 375,108 382,118 368,128" fill="url(#sgold-bright)" stroke="#8a6508" stroke-width="0.8" />
    <!-- Reset Pusher at 4 o'clock -->
    <polygon points="368,272 382,282 375,292 360,282" fill="url(#sgold-bright)" stroke="#8a6508" stroke-width="0.8" />

    <!-- Deep Executive Sunburst Navy Watch Face -->
    <circle cx="200" cy="200" r="172" fill="url(#sunburst-dial)" />

    <!-- Outer Tachymeter Ring (Track for Speed Calculation) -->
    <circle cx="200" cy="200" r="168" fill="none" stroke="#60a5fa" stroke-width="0.75" stroke-opacity="0.3" />
    <circle cx="200" cy="200" r="156" fill="none" stroke="url(#sgold-bevel)" stroke-width="1.5" />
    <circle cx="200" cy="200" r="148" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.4" stroke-dasharray="2 3" />

    <!-- 60 Precision Minute & Second Markers -->
    <g stroke="url(#sgold-specular)" stroke-linecap="round">
      <!-- 12 Major Hour Markers (Polished Gold Faceted Batons) -->
      <line x1="200" y1="52" x2="200" y2="70" stroke-width="3.5" />
      <line x1="274" y1="72" x2="265" y2="87" stroke-width="3" />
      <line x1="328" y1="126" x2="313" y2="135" stroke-width="3" />
      <line x1="348" y1="200" x2="330" y2="200" stroke-width="3.5" />
      <line x1="328" y1="274" x2="313" y2="265" stroke-width="3" />
      <line x1="274" y1="328" x2="265" y2="313" stroke-width="3" />
      <line x1="200" y1="348" x2="200" y2="330" stroke-width="3.5" />
      <line x1="126" y1="328" x2="135" y2="313" stroke-width="3" />
      <line x1="72" y1="274" x2="87" y2="265" stroke-width="3" />
      <line x1="52" y1="200" x2="70" y2="200" stroke-width="3.5" />
      <line x1="72" y1="126" x2="87" y2="135" stroke-width="3" />
      <line x1="126" y1="72" x2="135" y2="87" stroke-width="3" />
    </g>

    <!-- 12 O'Clock Double Master Ingot -->
    <line x1="196" y1="52" x2="196" y2="70" stroke="url(#sgold-bright)" stroke-width="2.5" />
    <line x1="204" y1="52" x2="204" y2="70" stroke="url(#sgold-bright)" stroke-width="2.5" />

    <!-- ============================================== -->
    <!-- 3 CHRONOGRAPH SUBDIALS (PRECISION SPEED METRICS) -->
    <!-- ============================================== -->

    <!-- Subdial 1: Top (30-Minute Turnaround Counter) -->
    <g transform="translate(200, 130)">
      <circle cx="0" cy="0" r="34" fill="url(#subdial-bg)" stroke="url(#sgold-bevel)" stroke-width="1.2" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#60a5fa" stroke-width="0.5" stroke-dasharray="2 3" />
      <!-- Subdial Markers -->
      <line x1="0" y1="-28" x2="0" y2="-22" stroke="url(#sgold-bright)" stroke-width="1.5" />
      <line x1="28" y1="0" x2="22" y2="0" stroke="url(#sgold-bright)" stroke-width="1" />
      <line x1="0" y1="28" x2="0" y2="22" stroke="url(#sgold-bright)" stroke-width="1" />
      <line x1="-28" y1="0" x2="-22" stroke="url(#sgold-bright)" stroke-width="1" />
      <!-- Subdial Active Gold Hand -->
      <line x1="0" y1="5" x2="12" y2="-18" stroke="url(#sgold-bright)" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="url(#sgold-specular)" />
    </g>

    <!-- Subdial 2: Left (Real-Time Precision Seconds) -->
    <g transform="translate(130, 200)">
      <circle cx="0" cy="0" r="34" fill="url(#subdial-bg)" stroke="url(#sgold-bevel)" stroke-width="1.2" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#60a5fa" stroke-width="0.5" stroke-dasharray="2 3" />
      <line x1="0" y1="-28" x2="0" y2="-22" stroke="url(#sgold-bright)" stroke-width="1.5" />
      <line x1="28" y1="0" x2="22" y2="0" stroke="url(#sgold-bright)" stroke-width="1" />
      <line x1="0" y1="28" x2="0" y2="22" stroke="url(#sgold-bright)" stroke-width="1" />
      <line x1="-28" y1="0" x2="-22" stroke="url(#sgold-bright)" stroke-width="1" />
      <!-- Subdial Active Hand -->
      <line x1="0" y1="4" x2="-16" y2="-10" stroke="url(#sgold-bright)" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="url(#sgold-specular)" />
    </g>

    <!-- Subdial 3: Bottom (12-Hour Urgent SCN Defense Counter) -->
    <g transform="translate(200, 270)">
      <circle cx="0" cy="0" r="34" fill="url(#subdial-bg)" stroke="url(#sgold-bevel)" stroke-width="1.2" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#60a5fa" stroke-width="0.5" stroke-dasharray="2 3" />
      <line x1="0" y1="-28" x2="0" y2="-22" stroke="url(#sgold-bright)" stroke-width="1.5" />
      <line x1="28" y1="0" x2="22" y2="0" stroke="url(#sgold-bright)" stroke-width="1" />
      <line x1="0" y1="28" x2="0" y2="22" stroke="url(#sgold-bright)" stroke-width="1" />
      <line x1="-28" y1="0" x2="-22" stroke="url(#sgold-bright)" stroke-width="1" />
      <!-- Subdial Active Hand -->
      <line x1="0" y1="4" x2="8" y2="16" stroke="url(#sgold-bright)" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="url(#sgold-specular)" />
    </g>

    <!-- ============================================== -->
    <!-- MASTER WATCH HANDS & RAPID CHRONO SECONDS HAND -->
    <!-- ============================================== -->
    <!-- Center Pinion -->
    <circle cx="200" cy="200" r="10" fill="url(#sgold-specular)" stroke="#8a6508" stroke-width="1" />

    <!-- Faceted Gold Hour Hand (Pointing toward 10:10 Corporate Stance) -->
    <polygon points="196,204 195,190 145,135 155,145 198,198" fill="url(#sgold-bright)" stroke="#aa820a" stroke-width="0.8" filter="drop-shadow(2px 3px 3px rgba(0,0,0,0.4))" />
    <polygon points="198,198 155,145 158,142 204,196" fill="#fef08a" opacity="0.6" />

    <!-- Faceted Gold Minute Hand (Pointing toward 2 o'clock) -->
    <polygon points="196,204 202,192 268,118 262,128 198,206" fill="url(#sgold-bright)" stroke="#aa820a" stroke-width="0.8" filter="drop-shadow(2px 3px 3px rgba(0,0,0,0.4))" />
    <polygon points="198,206 262,128 266,124 204,196" fill="#fef08a" opacity="0.6" />

    <!-- RAPID ELECTRIC-CYAN CHRONO SWEEP SECONDS HAND (High Velocity) -->
    <!-- Sweeping swiftly through the statutory zone toward the top -->
    <g filter="url(#cyan-glow)">
      <!-- Counterweight Ring -->
      <circle cx="200" cy="235" r="7" fill="none" stroke="#38bdf8" stroke-width="2" />
      <line x1="200" y1="242" x2="200" y2="200" stroke="#38bdf8" stroke-width="2" />
      <!-- Ultra-Fast Thin Pointer Arrow Needle -->
      <line x1="200" y1="200" x2="225" y2="60" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
      <!-- Arrow Tip -->
      <polygon points="225,58 221,68 229,66" fill="#ffffff" />
    </g>

    <!-- Center Cap Jewel & Gold Rivet -->
    <circle cx="200" cy="200" r="5" fill="#ffffff" stroke="url(#sgold-bevel)" stroke-width="1.2" />

    <!-- Ambient Sparkles -->
    <path d="M 225 58 L 227 63 L 232 64 L 227 65 L 225 70 L 223 65 L 218 64 L 223 63 Z" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />
    <path d="M 348 200 L 350 204 L 354 205 L 350 206 L 348 210 L 346 206 L 342 205 L 346 204 Z" fill="#ffffff" opacity="0.9" />

    <!-- Sapphire Watch Glass Curved Curved Reflection Highlight -->
    <path d="M 50 140 C 90 60, 220 30, 310 65 C 260 70, 160 110, 100 200 C 68 250, 52 300, 48 320 C 35 270, 35 190, 50 140 Z" fill="url(#ssapphire-reflection)" pointer-events-none />
  </g>
</svg>
